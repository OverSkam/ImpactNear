spring.application.name=projectV
server.port = 8080

# MySQL settings
spring.datasource.url=jdbc:mysql://localhost:3306/projectv
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.jpa.sql-show=true
logging.level.liquibase=INFO

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.cors.allowed-origins=http://localhost:5173

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.verification.base-url=http://localhost:5173/verify
app.password-reset.base-url=http://localhost:5173/reset-password
app.verification.token-ttl-minutes=30
spring.config.import=optional:file:.env[.properties]

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.oauth2.success-redirect=http://localhost:5173/oauth/callback
app.oauth2.failure-redirect=http://localhost:5173/login

app.r2.endpoint=${R2_ENDPOINT}
app.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.r2.bucket=${R2_BUCKET}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL}