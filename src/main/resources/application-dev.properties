spring.application.name=projectV
server.port = 8080

# MySQL settings
spring.datasource.url=jdbc:mysql://localhost:3306/projectv
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.jpa.sql-show=true
logging.level.liquibase=INFO

app.cors.allowed-origins=http://localhost:5173

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.verification.base-url=http://localhost:5173/verify
app.password-reset.base-url=http://localhost:5173/reset-password
app.verification.token-ttl-minutes=30
spring.config.import=optional:file:.env[.properties]