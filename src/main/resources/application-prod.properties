spring.application.name=projectV
server.port = ${DB_PORT:8080}

# MySQL settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.sql-show=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

app.cors.allowed-origins=${FRONTEND_URL}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.verification.base-url=${URL_FOR_EMAIL}/verify
app.password-reset.base-url=${URL_FOR_EMAIL}/reset-password
app.verification.token-ttl-minutes=30

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.oauth2.success-redirect=${FRONTEND_URL}/oauth/callback
app.oauth2.failure-redirect=${FRONTEND_URL}/login
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_PUBLIC_URL}/login/oauth2/code/google

app.r2.endpoint=${R2_ENDPOINT}
app.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.r2.bucket=${R2_BUCKET}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL}