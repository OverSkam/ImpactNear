databaseChangeLog:
  - changeSet:
      id: 006-create-event-images
      author: super
      changes:
        - createTable:
            tableName: event_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: create_date
                  type: datetime(6)
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: datetime(6)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: image_uuid
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: width
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: height
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: event_images
            baseColumnNames: event_id
            constraintName: fk_event_images_event
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: event_images
            columnNames: event_id, display_order
            constraintName: uq_event_images_event_order